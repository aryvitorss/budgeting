spring.application.name=budgeting
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.ai.google.genai.api-key=${GENAI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.8-flash
spring.ai.google.genai.chat.temperature=0.8

spring.ai.model.audio.transcription=google-genai
spring.ai.google.genai.audio.transcription.enabled=true
spring.ai.google.genai.audio.transcription.options.model=gemini-3.8-flash
spring.ai.google.genai.audio.transcription.options.language=pt-BR
spring.ai.google.genai.audio.transcription.options.temperature=0.4
spring.ai.google.genai.audio.transcription.options.response-mime-type=Áudio em português brasileiro.\
Áudio contém descrição de gastos financeiros. \
As frases geralmente contém: \
    - um valor emm reais (número + "reais"): \
    - uma ação(gastei, paguei,comprei)\
    - um local ou um estabelecimento(mercado, farmácia, restaurante, loja e etc.).

spring.ai.model.audio.speech=google-genai
spring.ai.google.genai.audio.speech.enabled=true
spring.ai.google.genai.audio.speech.options.model=gemini-3.8-flash-tts
spring.ai.google.genai.audio.speech.options.voice.name=pt-BR-Neural2-A
spring.ai.google.genai.audio.speech.options.voice.language-code=pt-BR
spring.ai.google.genai.audio.speech.options.voice.speaking-rate=1.2
spring.ai.google.genai.audio.speech.options.output-format=mp3

logging.level.org.springframework.ai=DEBUG